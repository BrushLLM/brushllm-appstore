    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        es-es: Zona horaria
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ms: Zon masa
        pt-br: Fuso horário
        ru: Часовой пояс
        tr: Saat Dilimi
      required: true
