additionalProperties:
  formFields:
    - default: 3000
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Web Port
      labelZh: Web 访问端口
      label:
        en: Web Port
        es-es: Puerto web
        zh: Web 访问端口
        zh-Hant: Web 訪問埠
        ja: Webポート
        ko: 웹 포트
        ms: Port Web
        pt-br: Porta Web
        ru: Веб-порт
        tr: Web Bağlantı Noktası
      required: true
      rule: paramPort
