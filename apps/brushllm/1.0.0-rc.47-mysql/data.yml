      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        es-es: Zona horaria
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ms: Zon masa
        pt-br: Fuso horário
        ru: Часовой пояс
        tr: Saat Dilimi
      required: true
      type: text
    - default: ''
      edit: true
      envKey: SESSION_SECRET
      labelEn: Session Secret (auto-generated if empty; must match across nodes)
      labelZh: 会话密钥（留空自动生成，多节点部署须各节点一致）
      label:
        en: Session Secret (auto-generated if empty; must match across nodes)
        es-es: Secreto de sesión (vacío para generar automáticamente; debe coincidir entre nodos)
        zh: 会话密钥（留空自动生成，多节点部署须各节点一致）
        zh-Hant: 會話金鑰（留空自動產生，多節點部署須各節點一致）
        ja: セッションシークレット（空欄で自動生成。マルチノードでは全ノードで統一）
        ko: 세션 시크릿(비워 두면 자동 생성, 다중 노드에서는 모든 노드가 동일해야 함)
        ms: Rahsia sesi (kosong untuk jana automatik; mesti sama pada semua nod)
        pt-br: Segredo de sessão (vazio para gerar automaticamente; deve coincidir entre nós)
        ru: Секрет сессии (пусто = создать автоматически; одинаков на всех узлах)
        tr: Oturum sırrı (otomatik oluşturmak için boş bırakın; tüm düğümlerde aynı olmalı)
      required: false
      type: password
      random: true
